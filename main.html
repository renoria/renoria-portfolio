<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renoria - Main</title>

  <link rel="icon" type="image/svg+xml" href="assets/icons/Logo_R_liscia.svg">

  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/boards.css">
  <link rel="stylesheet" href="assets/css/board.css">
  <link rel="stylesheet" href="assets/css/thread.css">

  <script src="assets/js/terminal.js" defer></script>
  <script src="assets/js/logs.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <div class="dashboard-background">
    <div class="frame-surround dashboard-surround">
      <main class="main-frame">
        <header class="topbar">
          <div class="status-wrap">
            <div class="dot"></div>
            <span>Renoria / Main</span>
          </div>

          <div class="topbar-actions">
            <button type="button" class="theme-toggle" data-theme-toggle lang="it"
                    aria-label="Tema Notte attivo. Passa a Giorno" title="Passa a Giorno">
              <svg class="theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M20.9 13.1A9 9 0 0 1 10.9 3.1 9 9 0 1 0 20.9 13.1Z"/>
              </svg>
              <svg class="theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
              </svg>
            </button>
            <a href="index.html" class="logout-button">Logout</a>
          </div>
        </header>

        <section class="main-layout">

          <aside class="sidebar">
            <div class="panel terminal-panel">
              <div class="panel-heading">
                <h2 class="section-title">Terminal</h2>
              </div>

              <div class="terminal-output" id="terminal-output" aria-live="polite"></div>
            </div>

            <div class="left-actions">
              <div class="panel action-panel">
                <nav class="sidebar-nav">
                  <a href="#" data-view="home">Home</a>
                </nav>
              </div>

              <div class="panel action-panel">
                <nav class="sidebar-nav">
                  <a href="#" data-view="admin">Admin</a>
                </nav>
              </div>
            </div>

            <div class="panel side-bottom presence-panel">
              <div class="panel-heading">
                <h2 class="section-title">Presence</h2>
              </div>

              <div class="presence-list">
                <a href="#" class="presence-item">Renoria</a>
                <a href="#" class="presence-item">Guest</a>
              </div>
            </div>
          </aside>

          <section class="main-column">
            <div id="module-container" class="module-container">
              <div class="module-fallback">
                <div class="main-background-logo">
                  <img class="home-emblem--night" src="assets/img/Spirale_gatto_notte.svg" alt="" draggable="false">
                  <img class="home-emblem--day" src="assets/img/Spirale_gatto_giorno_v3.svg" alt="" draggable="false">
                </div>
              </div>
            </div>
          </section>

          <aside class="right-column">
            <div class="panel status-panel">
              <div class="panel-heading">
                <h2 class="section-title">Status</h2>
              </div>

              <p class="panel-text">Modules online: 2</p>
              <p class="panel-text">Next target:<br>backend integration</p>
            </div>

            <div class="right-actions">
              <div class="panel action-panel">
                <nav class="sidebar-nav">
                  <a href="#" data-view="boards">Boards</a>
                </nav>
              </div>

              <div class="panel action-panel">
                <nav class="sidebar-nav">
                  <a href="#" data-view="office">Office</a>
                </nav>
              </div>
            </div>

            <div class="panel log-panel">
              <div class="panel-heading">
                <h2 class="section-title">Current log</h2>
              </div>

              <div class="log" id="main-log-container"></div>
            </div>
          </aside>

        </section>
      </main>
    </div>
  </div>
</body>
</html>
